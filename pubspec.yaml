name: adora_loc
description: A Flutter app that tracks device location in foreground, background, and terminated state.
version: 1.0.0+2

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  geolocator: ^11.0.0

  flutter_background_service: ^5.0.5
  flutter_background_service_android: ^6.2.2
  flutter_local_notifications: ^17.2.2
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  permission_handler: ^11.3.1
  intl: ^0.19.0
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true